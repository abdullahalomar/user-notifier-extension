<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Sound Notifier</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      width: 320px;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title span {
      font-size: 18px;
    }

    .user-profile {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .profile-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .profile-uuid {
      font-size: 11px;
      font-family: monospace;
      color: #60a5fa;
      margin-top: 4px;
      word-break: break-all;
    }

    .name-input-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      background: rgba(34, 197, 94, 0.2);
      color: var(--accent);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .user-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }

    .user-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .user-card:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .user-name {
      font-size: 13px;
      font-weight: 500;
    }

    .user-id-sub {
      font-size: 10px;
      color: var(--text-muted);
      font-family: monospace;
    }

    .sound-icon {
      font-size: 14px;
      opacity: 0.7;
    }

    .user-card:hover .sound-icon {
      opacity: 1;
      transform: scale(1.15);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      padding: 20px 10px;
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title"><span>🔔</span> Sound Notifier</div>
  </div>

  <div class="user-profile">
    <div class="profile-label">Your Identity (Unique UUID)</div>
    <div class="name-input-group">
      <input type="text" id="nameInput" placeholder="Enter display name">
      <button class="btn" id="saveNameBtn">Save</button>
    </div>
    <div class="profile-uuid" id="uuidDisplay">Loading UUID...</div>
  </div>

  <div class="section-title">
    Online Users
    <span class="badge" id="onlineCount">0 online</span>
  </div>

  <div class="user-list" id="userList">
    <div class="empty-state">Connecting to server...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
